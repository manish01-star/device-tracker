<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Device Audios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body{
            background:#f4f6fb;
            font-size:14px;
        }

        .top-card{
            background:#fff;
            border-radius:14px;
            padding:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .folder-card{
            border:none;
            border-radius:12px;
            transition:.2s;
            box-shadow:0 1px 6px rgba(0,0,0,.08);
        }

        .folder-card:hover{
            transform:translateY(-2px);
        }

        .folder-card .card-body{
            padding:12px;
        }

        .folder-icon{
            font-size:28px;
        }

        .folder-name{
            font-size:13px;
            font-weight:600;
            height:36px;
            overflow:hidden;
        }

        .folder-count{
            font-size:12px;
        }

        .folder-card .btn{
            padding:4px 10px;
            font-size:12px;
        }

        .audio-card{
            border:none;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 1px 6px rgba(0,0,0,.08);
            transition:.2s;
        }

        .audio-card:hover{
            transform:translateY(-2px);
        }

        .audio-card .card-body{
            padding:10px;
        }

        .audio-card h6{
            font-size:13px;
        }

        .audio-card small{
            font-size:11px;
        }

        audio{
            width:100%;
            height:40px;
        }

        @media(max-width:768px){

            h3{
                font-size:20px;
            }

            h4{
                font-size:16px;
            }

            .top-card{
                padding:10px;
            }

        }

    </style>

</head>

<body>

<div class="container py-4">

<div class="top-card">

<!-- Header -->

<div class="d-flex justify-content-between align-items-center mb-4">

<h3>

<i class="bi bi-music-note-beamed"></i>

Device Audios

</h3>

<div>

<button
class="btn btn-danger btn-sm"
onclick="deleteAllAudios()">

<i class="bi bi-trash"></i>

Delete

</button>

<a
href="/dashboard.html"
class="btn btn-secondary btn-sm">

<i class="bi bi-arrow-left"></i>

Back

</a>

</div>

</div>


<!-- Filters -->

<div class="row g-2 mb-4">

<div class="col-4">

<input
id="audioLimit"
class="form-control form-control-sm"
type="number"
placeholder="Limit"
value="20">

</div>

<div class="col-4">

<input
id="audioOffset"
class="form-control form-control-sm"
type="number"
placeholder="Offset"
value="0">

</div>

<div class="col-4">

<select
id="audioOrder"
class="form-select form-select-sm">

<option value="NEWEST">

Newest

</option>

<option value="OLDEST">

Oldest

</option>

</select>

</div>

</div>

<hr>

<!-- Audio Folders -->

<h4 class="mb-3">

📁 Audio Folders

</h4>

<div
id="folderGrid"
class="row g-3 mb-5">

</div>

<hr>

<!-- Uploaded Audios -->

<div class="d-flex justify-content-between align-items-center mb-3">

<h4>

🎵 Uploaded Audios

</h4>

<button
class="btn btn-success btn-sm"
onclick="openMicPage()">

<i class="bi bi-mic-fill"></i>

Mic Recordings

</button>

</div>

<div
id="audioGrid"
class="row g-4">

</div>

<nav class="mt-4">

<ul
id="pagination"
class="pagination justify-content-center">

</ul>

</nav>

</div>

</div>

<script src="/audios.js"></script>

</body>
</html>
