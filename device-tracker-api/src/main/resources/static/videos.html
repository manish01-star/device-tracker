<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Device Videos</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        video{

            width:100%;
            height:220px;

            object-fit:cover;

            border-radius:10px;

            background:black;

        }

        .page-link{

            cursor:pointer;

        }

    </style>

</head>

<body>

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center">

<h3>

<i class="bi bi-camera-reels-fill text-danger"></i>

Device Videos

</h3>

<div>

<button class="btn btn-danger me-2"

onclick="deleteAllVideos()">

<i class="bi bi-trash"></i>

Delete All

</button>

<a href="/dashboard.html"

class="btn btn-secondary">

<i class="bi bi-arrow-left"></i>

Back

</a>

</div>

</div>

<hr>

<div class="row" id="videoGrid">

</div>

<nav class="mt-4">

<ul class="pagination justify-content-center"

id="pagination">

</ul>

</nav>

</div>

<script>

const params=new URLSearchParams(window.location.search);

const deviceId=params.get("deviceId");

let videos=[];

let currentPage=1;

const pageSize=12;

loadVideos();

async function loadVideos(){

    const response=

    await fetch("/media/video/"+deviceId);

    videos=await response.json();

    renderVideos();

}

function renderVideos(){

    const start=(currentPage-1)*pageSize;

    const end=start+pageSize;

    const list=videos.slice(start,end);

    let html="";

    list.forEach(v=>{

        html+=`

<div class="col-lg-3 col-md-4 col-sm-6 mb-4">

<div class="card">

<video controls>

<source src="${v.videoUrl}"

type="video/mp4">

</video>

<div class="card-body">

<div class="fw-bold text-truncate">

${v.videoName}

</div>

<div class="small text-muted">

Size :

${formatSize(v.videoSize)}

</div>

<div class="small text-muted">

${v.createdAt ?? ""}

</div>

</div>

</div>

</div>

`;

    });

    document.getElementById("videoGrid").innerHTML=html;

    renderPagination();

}

function renderPagination(){

    const totalPages=Math.ceil(videos.length/pageSize);

    let html="";

    for(let i=1;i<=totalPages;i++){

        html+=`

<li class="page-item ${currentPage==i?"active":""}">

<a class="page-link"

onclick="gotoPage(${i})">

${i}

</a>

</li>

`;

    }

    document.getElementById("pagination").innerHTML=html;

}

function gotoPage(page){

    currentPage=page;

    renderVideos();

}

async function deleteAllVideos(){

    if(!confirm("Delete all videos?")){

        return;

    }

    const response=

    await fetch(

        "/media/video/"+deviceId,

        {

            method:"DELETE"

        }

    );

    alert(await response.text());

    videos=[];

    renderVideos();

}

function formatSize(bytes){

    if(bytes<1024)

        return bytes+" B";

    if(bytes<1024*1024)

        return (bytes/1024).toFixed(1)+" KB";

    if(bytes<1024*1024*1024)

        return (bytes/1024/1024).toFixed(1)+" MB";

    return (bytes/1024/1024/1024).toFixed(1)+" GB";

}

</script>

</body>

</html>
