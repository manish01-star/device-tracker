<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Device Videos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .card video{
            width:100%;
            height:220px;
            object-fit:cover;
            border-radius:12px 12px 0 0;
            background:#000;
        }

        .page-link{
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">

        <h3 class="mb-2">
            🎥 Device Videos
        </h3>

        <div class="d-flex gap-2 flex-wrap">

            <button
                class="btn btn-success btn-sm"
                onclick="getVideos()">

                <i class="bi bi-download"></i>

                Get Videos

            </button>

            <button
                class="btn btn-danger btn-sm"
                onclick="deleteAllVideos()">

                Delete All

            </button>

            <a
                href="/dashboard.html"
                class="btn btn-secondary btn-sm">

                Back

            </a>

        </div>

    </div>

    <hr>

    <div
        id="videoGrid"
        class="row g-4">

    </div>

    <nav class="mt-4">

        <ul
            id="pagination"
            class="pagination justify-content-center">

        </ul>

    </nav>

</div>

<script>

const params = new URLSearchParams(location.search);

const deviceId = params.get("deviceId");

let videos = [];

let currentPage = 1;

const pageSize = 12;

loadVideos();

async function loadVideos(){

    try{

        const response = await fetch("/media/video/" + deviceId);

        const data = await response.json();


        videos = Array.isArray(data) ? data : [];

        currentPage = 1;

        renderVideos();

    }
    catch(e){

        console.error(e);

        videos=[];

        renderVideos();

    }

}

function renderVideos(){

    const start = (currentPage-1)*pageSize;

    const end = start+pageSize;

    const list = videos.slice(start,end);

    let html="";

    list.forEach(video=>{

        html+=`

        <div class="col-lg-3 col-md-4 col-sm-6">

            <div class="card">

                <video controls>

                    <source
                        src="${video.videoUrl}"
                        type="video/mp4">

                </video>

                <div class="card-body">

                    <div class="fw-bold text-truncate">

                        ${video.videoName}

                    </div>

                    <small class="text-muted d-block">

                        ${formatSize(video.videoSize)}

                    </small>

                    <small class="text-muted">

                        ${video.createdAt ?? ""}

                    </small>

                </div>

            </div>

        </div>

        `;

    });

    document.getElementById("videoGrid").innerHTML=html;

    renderPagination();

}

function renderPagination(){

    const total = Math.ceil(videos.length/pageSize);

    let html="";

    for(let i=1;i<=total;i++){

        html+=`

        <li class="page-item ${currentPage==i?'active':''}">

            <button
                class="page-link"
                onclick="gotoPage(${i})">

                ${i}

            </button>

        </li>

        `;

    }

    document.getElementById("pagination").innerHTML=html;

}

function gotoPage(page){

    currentPage=page;

    renderVideos();

}

async function deleteAllVideos(){

    if(!confirm("Delete all videos?")){

        return;

    }

    const response =
        await fetch(

            "/media/video/"+deviceId,

            {

                method:"DELETE"

            }

        );

    alert(await response.text());

    loadVideos();

}

async function getVideos(){

    if(!deviceId){

        alert("Device Not Found");

        return;

    }

    if(!confirm("Request videos from device?")){

        return;

    }

    const response =
        await fetch(

            "/media/video/request/"+deviceId,

            {

                method:"POST"

            }

        );

    alert(await response.text());

}

function formatSize(bytes){

    if(!bytes){

        return "0 B";

    }

    if(bytes<1024){

        return bytes+" B";

    }

    if(bytes<1024*1024){

        return (bytes/1024).toFixed(2)+" KB";

    }

    if(bytes<1024*1024*1024){

        return (bytes/1024/1024).toFixed(2)+" MB";

    }

    return (bytes/1024/1024/1024).toFixed(2)+" GB";

}

</script>

</body>

</html>
