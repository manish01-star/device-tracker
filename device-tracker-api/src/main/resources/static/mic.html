<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Device Mic Recordings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            font-size: 14px;
        }

        .top-card {
            background: #fff;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .mic-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .08);
            transition: .2s;
        }

        .mic-card:hover {
            transform: translateY(-2px);
        }

        .mic-card .card-body {
            padding: 10px;
        }

        .mic-title {
            font-size: 13px;
            font-weight: 600;
        }

        .mic-info {
            font-size: 12px;
            color: #666;
        }

        audio {
            width: 100%;
            margin-top: 8px;
        }

        @media(max-width:768px) {

            h3 {
                font-size: 20px;
            }

            h4 {
                font-size: 16px;
            }

            .top-card {

                padding: 12px;

            }

            .top-card h3 {

                font-size: 20px;

            }

            .top-card button {

                width: 100%;

            }

            .top-card .d-flex.gap-2 {

                display: grid !important;

                grid-template-columns: repeat(2, 1fr);

                width: 100%;

            }

            .card-body {

                padding: 12px;

            }

            .mic-title {

                font-size: 14px;

            }

            audio {

                height: 36px;

            }


        }
    </style>

</head>

<body>

    <div class="container py-4">

        <div class="top-card">

            <!-- HEADER -->

            <div
                class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4">

                <div class="mb-3 mb-md-0">

                    <h3 class="mb-1">
                        <i class="bi bi-mic-fill text-danger"></i>
                        Device Mic Recordings
                    </h3>

                    <small class="text-muted">
                        Record, Download & Manage Device Microphone Files
                    </small>

                </div>

                <div class="d-flex flex-wrap gap-2">

                    <button class="btn btn-success btn-sm" onclick="requestMicRecording()">
                        <i class="bi bi-mic-fill"></i>
                        Record
                    </button>

                    <button class="btn btn-warning btn-sm" onclick="loadMicRecordings()">
                        <i class="bi bi-arrow-repeat"></i>
                        Refresh
                    </button>

                    <button class="btn btn-danger btn-sm" onclick="deleteAllMicRecordings()">
                        <i class="bi bi-trash"></i>
                        Delete
                    </button>

                    <button class="btn btn-secondary btn-sm" onclick="goBack()">
                        <i class="bi bi-arrow-left"></i>
                        Back
                    </button>

                </div>

            </div>

            <div class="card border-0 shadow-sm mb-4">

                <div class="card-body">

                    <div class="row align-items-end">

                        <div class="col-md-4">

                            <label class="form-label fw-semibold">

                                Recording Duration

                            </label>

                            <input id="duration" type="number" class="form-control" value="30" min="5" max="300">

                        </div>

                        <div class="col-md-8">

                            <small class="text-muted">

                                Enter duration between
                                <b>5</b>
                                and
                                <b>300</b>
                                seconds.

                            </small>

                        </div>

                    </div>

                </div>

            </div>

            <hr>

            <h4 class="mb-3">

                🎤 Uploaded Recordings

            </h4>

            <div id="micGrid" class="row g-4">

            </div>

            <nav class="mt-4">

                <ul id="pagination" class="pagination justify-content-center">

                </ul>

            </nav>

        </div>

    </div>

    <script>

        const params =
            new URLSearchParams(location.search);

        const deviceId =
            params.get("deviceId");

        let recordings = [];

        const pageSize = 12;

        let currentPage = 1;

        loadMicRecordings();

        function loadMicRecordings() {

            fetch("/media/mic/" + deviceId)

                .then(res => res.json())

                .then(result => {

                    recordings = result.data || [];

                    currentPage = 1;

                    renderPage();

                })

                .catch(err => {

                    console.error(err);

                    alert("Unable to load mic recordings.");

                });

        }

        function goBack() {

            window.location.href =
                "/audios.html?deviceId=" +
                encodeURIComponent(deviceId);

        }

        function renderPage() {

            const start = (currentPage - 1) * pageSize;

            const end = start + pageSize;

            const page = recordings.slice(start, end);

            let html = "";

            page.forEach(item => {

                html += `

                         <div class="col-12 col-sm-6 col-lg-3">
                         
                         <div class="card mic-card h-100 shadow-sm">
                         
                         <div class="card-body">
                         
                         <div class="d-flex justify-content-between align-items-center mb-2">
                         
                         <span class="badge bg-danger">
                         
                         MIC
                         
                         </span>
                         
                         <small class="text-muted">
                         
                         ${item.createdAt ?? "-"}
                         
                         </small>
                         
                         </div>
                         
                         <div class="mic-title text-truncate mb-2">
                         
                         ${item.fileName}
                         
                         </div>
                         
                         <audio controls>
                         
                         <source src="${item.fileUrl}">
                         
                         </audio>
                         
                         <div class="mt-3">
                         
                         <div class="d-flex justify-content-between">
                         
                         <span class="text-muted">
                         
                         Duration
                         
                         </span>
                         
                         <b>${item.duration} sec</b>
                         
                         </div>
                         
                         <div class="d-flex justify-content-between">
                         
                         <span class="text-muted">
                         
                         Size
                         
                         </span>
                         
                         <b>${formatSize(item.fileSize)}</b>
                         
                         </div>
                         
                         </div>
                         
                         <div class="d-grid mt-3">
                         
                         <a
                         href="${item.fileUrl}"
                         download
                         class="btn btn-primary btn-sm">
                         
                         <i class="bi bi-download"></i>
                         
                         Download
                         
                         </a>
                         
                         </div>
                         
                         </div>
                         
                         </div>
                         
                         </div>
                         
                         `;

            });

            if (recordings.length === 0) {

                html = `

        <div class="col-12">

            <div class="alert alert-warning text-center">

                No Mic Recording Found

            </div>

        </div>

        `;

            }

            document.getElementById("micGrid").innerHTML = html;

            renderPagination();

        }



        function renderPagination() {

            let html = "";

            const total = Math.ceil(recordings.length / pageSize);

            for (let i = 1; i <= total; i++) {

                html += `

        <li class="page-item ${i == currentPage ? "active" : ""}">

            <button
                class="page-link"
                onclick="gotoPage(${i})">

                ${i}

            </button>

        </li>

        `;

            }

            document.getElementById("pagination").innerHTML = html;

        }



        function gotoPage(page) {

            currentPage = page;

            renderPage();

        }



        function requestMicRecording() {

            const duration = parseInt(
                document.getElementById("duration").value
            );

            if (isNaN(duration) || duration <= 0) {

                alert("Invalid Duration");

                return;

            }

            fetch("/media/mic/refresh", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    deviceId: deviceId,

                    duration: duration

                })

            })

                .then(res => res.json())

                .then(result => {

                    alert(result.message || "Request Sent");

                })

                .catch(err => {

                    console.error(err);

                    alert("Unable to send request.");

                });

        }



        function deleteAllMicRecordings() {

            if (!confirm("Delete all mic recordings ?")) {

                return;

            }

            fetch("/media/mic/" + deviceId, {

                method: "DELETE"

            })

                .then(res => {

                    if (res.ok) {

                        alert("Deleted Successfully");

                        loadMicRecordings();

                    }
                    else {

                        alert("Delete Failed");

                    }

                });

        }



        function formatSize(bytes) {

            if (!bytes)
                return "0 B";

            if (bytes < 1024)
                return bytes + " B";

            if (bytes < 1024 * 1024)
                return (bytes / 1024).toFixed(2) + " KB";

            if (bytes < 1024 * 1024 * 1024)
                return (bytes / 1024 / 1024).toFixed(2) + " MB";

            return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";

        }



        // Auto Refresh

        setInterval(function () {

            loadMicRecordings();

        }, 10000);

    </script>

</body>

</html>
