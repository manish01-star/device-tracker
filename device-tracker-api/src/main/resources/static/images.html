<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Device Images</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .card img{

            height:220px;
            object-fit:cover;
            cursor:pointer;

        }

    </style>

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">

        <h3>

            Device Images

        </h3>

        <div>

            <button
                class="btn btn-danger me-2"
                onclick="deleteAllImages()">

                Delete All

            </button>

            <a
                href="/dashboard.html"
                class="btn btn-secondary">

                Back

            </a>

        </div>

    </div>

    <hr>

    <div
        id="imageGrid"
        class="row g-3">

    </div>

    <nav class="mt-4">

        <ul
            class="pagination justify-content-center"
            id="pagination">

        </ul>

    </nav>

</div>

<!-- Preview -->

<div
    class="modal fade"
    id="previewModal">

    <div
        class="modal-dialog modal-xl modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-body text-center">

                <img
                    id="previewImage"
                    class="img-fluid">

            </div>

        </div>

    </div>

</div>

<script>

const params =
new URLSearchParams(location.search);

const deviceId =
params.get("deviceId");

let images=[];

const pageSize=12;

let currentPage=1;

loadImages();

async function loadImages(){

    const response=
    await fetch("/media/image/"+deviceId);

    images=
    await response.json();

    renderPage();

}

function renderPage(){

    const start=
    (currentPage-1)*pageSize;

    const end=
    start+pageSize;

    const page=
    images.slice(start,end);

    let html="";

    page.forEach(image=>{

        html+=`

        <div class="col-md-3">

            <div class="card">

                <img

                    src="${image.imageUrl}"

                    onclick="preview('${image.imageUrl}')"

                    class="card-img-top">

                <div class="card-body">

                    <div
                        class="fw-bold text-truncate">

                        ${image.imageName}

                    </div>

                    <small
                        class="text-muted">

                        ${(image.imageSize/1024/1024).toFixed(2)} MB

                    </small>

                </div>

            </div>

        </div>

        `;

    });

    imageGrid.innerHTML=html;

    renderPagination();

}

function renderPagination(){

    let html="";

    const total=
    Math.ceil(images.length/pageSize);

    for(let i=1;i<=total;i++){

        html+=`

        <li class="page-item ${i==currentPage?'active':''}">

            <button
                class="page-link"
                onclick="gotoPage(${i})">

                ${i}

            </button>

        </li>

        `;

    }

    pagination.innerHTML=html;

}

function gotoPage(page){

    currentPage=page;

    renderPage();

}

function preview(url){

    previewImage.src=url;

    new bootstrap.Modal(

        document.getElementById("previewModal")

    ).show();

}

async function deleteAllImages(){

    if(!confirm("Delete all images?")){

        return;

    }

    const response=
    await fetch(

        "/media/image/"+deviceId,

        {

            method:"DELETE"

        }

    );

    if(response.ok){

        alert("Deleted Successfully");

        loadImages();

    }

    else{

        alert("Delete Failed");

    }

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
