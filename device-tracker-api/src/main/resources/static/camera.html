<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Live Camera</title>

    <script src="https://cdn.jsdelivr.net/npm/webrtc-adapter@9.0.3/out/adapter.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container py-4">

    <h2 class="mb-4">Live Camera</h2>

    <div class="d-flex align-items-center gap-3 mb-4">

        <select id="cameraType" class="form-select" style="width:220px">

            <option value="FRONT">
                Front Camera
            </option>

            <option value="BACK">
                Back Camera
            </option>

            <option value="BOTH">
                Both Cameras
            </option>

        </select>

        <button class="btn btn-success" onclick="startCamera()">
            Start Live
        </button>

        <button class="btn btn-danger" onclick="stopCamera()">
            Stop
        </button>

        <a href="/dashboard.html" class="btn btn-secondary">
            Back
        </a>

    </div>

    <video id="remoteVideo" autoplay playsinline controls
        style="width:100%;max-width:900px;height:600px;background:black;border-radius:10px;">
    </video>

    <script>

        const params = new URLSearchParams(location.search);

        const deviceId = params.get("deviceId");

        let peerConnection = null;

        const configuration = {

            iceServers: [

                {
                    urls: "stun:stun.l.google.com:19302"
                }

            ]

        };

        const socket = new WebSocket(
            "ws://" + location.host + "/signal?type=browser&deviceId=" + deviceId
        );

        socket.onopen = () => {

            console.log("Browser Connected");

        };

        socket.onclose = () => {

            console.log("Socket Closed");

        };

        socket.onerror = (e) => {

            console.log(e);

        };

        socket.onmessage = async (event) => {

            console.log("RAW =", event.data);

            const message = JSON.parse(event.data);

            console.log("PARSED =", message);

            switch (message.type) {

                case "offer":

                    await receiveOffer(message);

                    break;

                case "candidate":

                    if (peerConnection) {

                        await peerConnection.addIceCandidate(

                            new RTCIceCandidate({

                                candidate: message.candidate,

                                sdpMid: message.sdpMid,

                                sdpMLineIndex: message.sdpMLineIndex

                            })

                        );

                    }

                    break;

                case "stop":

                    stopPeer();

                    break;

            }

        };

        async function receiveOffer(message) {

            console.log("Offer Received");

            stopPeer();

            peerConnection = new RTCPeerConnection(configuration);

            peerConnection.ontrack = function (event) {

                console.log("Track Received");

                document.getElementById("remoteVideo").srcObject =
                    event.streams[0];

            };

            peerConnection.onicecandidate = function (event) {

                if (event.candidate) {

                    socket.send(

                        JSON.stringify({

                            deviceId: deviceId,

                            type: "candidate",

                            candidate: event.candidate.candidate,

                            sdpMid: event.candidate.sdpMid,

                            sdpMLineIndex: event.candidate.sdpMLineIndex

                        })

                    );

                }

            };

            peerConnection.onconnectionstatechange = function () {

                console.log(
                    "Connection State : ",
                    peerConnection.connectionState
                );

            };

            await peerConnection.setRemoteDescription(

                new RTCSessionDescription({

                    type: "offer",

                    sdp: message.sdp

                })

            );

            const answer =
                await peerConnection.createAnswer();

            await peerConnection.setLocalDescription(answer);

            socket.send(

                JSON.stringify({

                    deviceId: deviceId,

                    type: "answer",

                    sdp: answer.sdp

                })

            );

        }

        function startCamera() {

            stopPeer();

            const cameraType = document.getElementById("cameraType").value;

            fetch("/media/camera/request", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    deviceId: deviceId,

                    cameraType: cameraType

                })

            })
                .then(response => response.json())
                .then(data => {

                    console.log("Camera Request Sent", data);

                })
                .catch(err => {

                    console.error(err);

                });

        }

        function stopCamera() {

            fetch(

                "/media/camera/stopped/" + deviceId,

                {

                    method: "POST"

                }

            );

            stopPeer();

        }

        function stopPeer() {

            if (peerConnection) {

                peerConnection.close();

                peerConnection = null;

            }

            document.getElementById("remoteVideo").srcObject = null;

        }

        window.onbeforeunload = function () {

            stopPeer();

            socket.close();

        };

    </script>

</body>

</html>
